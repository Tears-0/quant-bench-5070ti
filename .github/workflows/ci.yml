# CI has no GPU (requirements.md §0.5, §11.3). Everything here runs on a plain runner:
# lint, type check, the full test suite against the mock engine, config validation,
# GPU-less planning, and figure regeneration from committed results.
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync the core environment
        run: uv sync --extra dev --python ${{ matrix.python-version }}

      - name: Lint
        run: |
          uv run ruff check src tests
          uv run ruff format --check src tests

      - name: Type check
        run: uv run mypy

      - name: Tests
        run: uv run pytest -q

      - name: Validate every config and expand every profile
        run: |
          uv run quantbench validate --profile smoke
          uv run quantbench validate --profile core
          uv run quantbench validate --profile full

      - name: Preflight on a GPU-less machine must still report, not crash
        run: uv run quantbench preflight --no-require-gpu --out /tmp/environment.json

      - name: Plan and dry-run the pipeline without a GPU
        run: |
          uv run quantbench plan --profile smoke --out plan.smoke.json
          uv run quantbench run --plan plan.smoke.json --dry-run

  figures:
    # Figures must regenerate from committed results, byte-identically, with no GPU.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --extra dev

      - name: Regenerate figures from committed results
        run: |
          if [ -f results/results.parquet ]; then
            uv run quantbench plot --results results/results.parquet --out figures/
          else
            echo "no committed results yet; nothing to regenerate"
            exit 0
          fi

      - name: Fail if regenerated figures differ from the committed ones
        run: |
          if [ -n "$(git status --porcelain figures/)" ]; then
            echo "::error::figures/ changed after regeneration — commit the regenerated files"
            git --no-pager diff --stat figures/
            exit 1
          fi
